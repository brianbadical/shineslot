<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Japanese Card Converter</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#14161c"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#14161c;--card:#1f222b;--line:#323643;--text:#f3f4f6;--dim:#a3a8b5;--gold:#ffcb05;--green:#4ade80;--red:#f87171;--blue:#60a5fa}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 0;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 8px;display:flex;align-items:center;gap:8px}h1 img{width:28px;height:28px}
.net{margin-left:auto;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:#1d3b2a;color:var(--green)}.net.off{background:#3b1d1d;color:var(--red)}
nav{display:flex;gap:4px}nav button{flex:1;background:none;border:0;color:var(--dim);font:inherit;font-weight:600;padding:10px 4px;border-bottom:3px solid transparent}
nav button.on{color:var(--gold);border-color:var(--gold)}
main{padding:16px;max-width:720px;margin:0 auto;padding-bottom:60px}
.quick{background:var(--card);border-radius:14px;padding:12px;margin-bottom:14px}
summary{font-weight:600;color:var(--blue);cursor:pointer;padding:4px 0}details form{margin-top:10px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
label{display:block;font-weight:600;margin:0 0 6px}
input{width:100%;font:inherit;font-size:20px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f1116;color:var(--text)}
.big{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:700;font-size:18px;padding:14px;border-radius:12px;border:0;background:var(--gold);color:#14161c;margin:8px 0}
.big.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.hint{color:var(--dim);font-size:14px;margin:6px 0}
.help{text-align:center;color:var(--dim);padding:10px 6px}.help b{color:var(--text)}
.pair{scroll-margin-top:110px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
figure{margin:0;text-align:center}figure img{width:100%;border-radius:10px;background:#2a2e39;aspect-ratio:600/825;object-fit:cover}
figcaption{font-size:13px;font-weight:700;color:var(--dim);margin-top:4px}
figure.none div{aspect-ratio:600/825;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--dim);padding:10px}
h2{font-size:22px;margin:14px 0 8px}h2 small{font-size:15px;color:var(--dim);font-weight:500}h3{margin:20px 0 6px}
.verdict{border-radius:12px;padding:12px;margin:8px 0 12px;font-size:16px}
.verdict.ok{background:#1d3b2a;color:#c9f7d8}.verdict.maybe{background:#3a3214;color:#ffeaa0}.verdict.no{background:#3b1d1d;color:#ffd0d0}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.tot{background:var(--card);border-radius:12px;padding:10px 12px}.tot b{display:block;font-size:24px}.tot span{color:var(--dim);font-size:13px;display:block}
.facts{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px}.facts td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}.facts td:first-child{color:var(--dim);width:38%}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.picks div{background:var(--card);border-radius:8px;padding:4px;font-size:12px;text-align:center;cursor:pointer;border:2px solid transparent}
.picks div.on{border-color:var(--gold)}.picks img{width:100%;border-radius:6px;aspect-ratio:600/825;object-fit:cover;background:#2a2e39}.picks span{display:block;padding:2px 0}
.row{display:flex;gap:12px;background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px;align-items:center;cursor:pointer}
.row img{width:56px;height:78px;object-fit:cover;border-radius:6px;background:#2a2e39;flex:none}
.row .info{flex:1;min-width:0}.row .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{color:var(--dim);font-size:14px}.row .val{text-align:right;flex:none}.row .val b{font-size:19px;display:block}
.empty{text-align:center;color:var(--dim);padding:30px 10px}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 10px;animation:s 0.8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b3245;padding:12px 18px;border-radius:12px;z-index:30;display:none;font-weight:600}
.shot{touch-action:none}.shot canvas{display:block;max-width:100%;border-radius:10px;touch-action:none;cursor:crosshair}
.crop{text-align:center;margin-bottom:12px}.crop img{max-width:100%;max-height:55vh;border-radius:10px}
label.photo{cursor:pointer;margin:12px 0}
.rate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px}.rate label{margin:0}.rate input{width:90px;font-size:17px;padding:8px}.rate .hint{flex-basis:100%;margin:0}
.big-verdict{font-size:19px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}.tag.ok{background:#1d3b2a;color:var(--green)}.tag.maybe{background:#3a3214;color:var(--gold)}.tag.no{background:#3b1d1d;color:var(--red)}
.xdel{display:block;margin:6px 0 0 auto;background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px}.xdel.sure{color:var(--red);border-color:var(--red)}
.noimg{aspect-ratio:600/825;border-radius:6px;background:#2a2e39;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:700;padding:6px;color:var(--text)}.noimg small{font-size:11px;color:var(--dim);font-weight:500;margin-top:4px}
.flt{margin:4px 0 10px;font-size:17px}
.stack>div{margin-bottom:10px}
.foot{color:var(--dim);font-size:12px;text-align:center;margin-top:24px}
</style></head><body>
<header><h1><img src="icon.svg" alt="">Japanese Card Converter <span id="net" class="net">Online</span></h1>
<nav><button data-tab="scan" class="on">Scan a case</button><button data-tab="find">Look up</button><button data-tab="history">History</button></nav></header>
<main id="main"></main>
<p class="foot">Card data and prices from TCGdex (TCGplayer and Cardmarket). Prices are a guide.</p>
<div class="toast" id="toast"></div>
<script src="logic.js"></script>
<script src="app.js"></script>
<script src="scan.js"></script>
</body></html>
