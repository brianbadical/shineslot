<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card Show Pricer</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#14161c"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#14161c;--card:#1f222b;--line:#323643;--text:#f3f4f6;--dim:#a3a8b5;--gold:#ffcb05;--green:#4ade80;--red:#f87171;--blue:#60a5fa}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 0;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 8px;display:flex;align-items:center;gap:8px}h1 img{width:28px;height:28px}
.net{margin-left:auto;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:#1d3b2a;color:var(--green)}.net.off{background:#3b1d1d;color:var(--red)}
nav{display:flex;gap:4px}nav button{flex:1;background:none;border:0;color:var(--dim);font:inherit;font-weight:600;padding:10px 4px;border-bottom:3px solid transparent}
nav button.on{color:var(--gold);border-color:var(--gold)}
main{padding:16px;max-width:720px;margin:0 auto;padding-bottom:90px}
.totals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.tot{background:var(--card);border-radius:12px;padding:10px 12px}.tot b{display:block;font-size:22px}.tot span{color:var(--dim);font-size:13px}
.row{display:flex;gap:12px;background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px;align-items:center;cursor:pointer}
.row img{width:64px;height:89px;object-fit:cover;border-radius:6px;background:#2a2e39;flex:none}
.row .info{flex:1;min-width:0}.row .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{color:var(--dim);font-size:14px}.row .val{text-align:right;flex:none}.row .val b{font-size:20px;display:block}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:#2b3245;color:var(--blue);margin-right:4px}
.tag.g{background:#3a3214;color:var(--gold)}.tag.s{background:#1d3b2a;color:var(--green)}.tag.w{background:#3b1d1d;color:var(--red)}
.up{color:var(--green)}.down{color:var(--red)}
button.big,.big{display:block;width:100%;font:inherit;font-weight:700;font-size:18px;padding:14px;border-radius:12px;border:0;background:var(--gold);color:#14161c;margin:8px 0}
button.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}button.danger{background:none;color:var(--red);border:1px solid #5a2a2a}
textarea,input,select{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f1116;color:var(--text)}
textarea{min-height:170px}label{display:block;font-weight:600;margin:12px 0 6px}
.hint{color:var(--dim);font-size:14px;margin:6px 0}
.search{margin-bottom:12px}
.sheet{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}.sheet.on{display:flex}
.sheet .in{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;border-top:1px solid var(--line)}
.dhead{display:flex;gap:14px}.dhead img{width:130px;border-radius:8px;flex:none}
.solds{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}.solds td{padding:8px 4px;border-bottom:1px solid var(--line)}
.solds tr.off td{color:#666;text-decoration:line-through}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:1.2fr 1fr auto;gap:6px;align-items:end}
.three button{padding:12px 14px;font-weight:700;border-radius:10px;border:0;background:var(--blue);color:#0b1220;font:inherit}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.picks div{background:var(--card);border-radius:8px;padding:4px;font-size:12px;text-align:center;cursor:pointer}.picks img{width:100%;border-radius:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b3245;padding:12px 18px;border-radius:12px;z-index:30;display:none;font-weight:600}
.empty{text-align:center;color:var(--dim);padding:30px 10px}
.quick{background:var(--card);border-radius:14px;padding:12px;margin-bottom:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.seg button{font:inherit;font-weight:700;font-size:15px;padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:#0f1116;color:var(--dim)}
.seg button.on{background:var(--gold);color:#14161c;border-color:var(--gold)}.seg button.on.expense{background:var(--red);border-color:var(--red)}
button.add{background:var(--green)}button.spend{background:var(--red)}
.totals.day{grid-template-columns:1fr 1fr}.tot.wide{grid-column:1/-1}
.xrow{cursor:default;min-height:56px}.xdel{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}.xdel.sure{color:var(--red);border-color:var(--red)}
h3{margin:18px 0 8px}
</style></head><body>
<header><h1><img src="icon.svg" alt="">Card Show Pricer <span id="net" class="net">Online</span></h1>
<nav><button data-tab="cards" class="on">My cards</button><button data-tab="add">Add cards</button><button data-tab="sales">Sales</button></nav></header>
<main id="main"></main>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body></html>
